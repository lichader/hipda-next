apply plugin: 'com.android.application'
apply plugin: 'com.google.dagger.hilt.android'

android {
    namespace = 'com.lichader.hipdanext'
    compileSdk = rootProject.ext.compileSdkVersion as int

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.lichader.hipdanext"
        minSdk = rootProject.ext.minSdkVersion as int
        targetSdk = rootProject.ext.targetSdkVersion as int
        versionCode = 5005
        versionName = "5.0.05"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                maxHeapSize = "2g"
                // The cookie store serializes java.net.HttpCookie with Gson reflection,
                // which JDK 17+ blocks unless the package is opened (Android does not).
                jvmArgs '--add-opens', 'java.base/java.net=ALL-UNNAMED'
            }
        }
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "com.google.android.material:material:1.12.0"
    // 2.11+ requires API 23; keep 2.10.x while minSdk is 21.
    implementation "androidx.work:work-runtime:2.10.0"
    implementation "androidx.security:security-crypto:1.0.0"

    implementation "androidx.browser:browser:1.3.0"

    implementation "com.google.dagger:hilt-android:$hilt_version"
    annotationProcessor "com.google.dagger:hilt-compiler:$hilt_version"
    // 1.3+ requires API 23; keep 1.2.x while minSdk is 21.
    implementation "androidx.hilt:hilt-work:1.2.0"
    annotationProcessor "androidx.hilt:hilt-compiler:1.2.0"

    implementation 'org.jsoup:jsoup:1.11.3'

    implementation(platform("com.squareup.okhttp3:okhttp-bom:4.12.0"))
    implementation("com.squareup.okhttp3:okhttp")
    implementation("com.squareup.okhttp3:logging-interceptor")

    implementation "net.gotev:cookie-store:1.3.5"
    implementation "net.gotev:cookie-store-okhttp:1.3.5"

    implementation 'com.google.code.gson:gson:2.9.0'

    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation "com.github.bumptech.glide:okhttp3-integration:4.12.0"
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    implementation 'com.birbit:android-priority-jobqueue:2.0.1'
    implementation 'org.greenrobot:eventbus:3.0.0'

    implementation 'com.davemorrissey.labs:subsampling-scale-image-view:3.10.0'

    implementation "com.mikepenz:materialdrawer:6.1.2"
    implementation "com.mikepenz:iconics-core:3.2.1"

    implementation 'com.mikepenz:google-material-typeface:2.2.0.2.original@aar'
    implementation 'com.mikepenz:fontawesome-typeface:4.6.0.2@aar'

    implementation 'com.github.MasayukiSuda:BubbleLayout:v1.2.1'
    implementation('com.vdurmont:emoji-java:3.1.3') {
        exclude group: 'org.json', module: 'json'
    }

    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    implementation 'io.github.inflationx:viewpump:2.1.0'

    implementation 'id.zelory:compressor:2.1.1'

    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':emoji')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation "androidx.work:work-testing:2.10.0"
    testImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    testAnnotationProcessor "com.google.dagger:hilt-compiler:$hilt_version"

}