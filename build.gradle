// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.hilt_version = '2.60.1'
    ext.kotlin_version = '2.4.10'
    ext.ksp_version = '2.3.14'
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.3'
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        // AGP 9 compiles Kotlin itself (built-in Kotlin); this pins the Kotlin compiler
        // version it uses instead of the older one AGP depends on.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$ksp_version"
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url = 'https://jitpack.io' }
    }
}

ext {
    minSdkVersion = 21
    compileSdkVersion = 37
    targetSdkVersion = 37
}
