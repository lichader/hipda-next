# Project-wide Gradle settings required to build from a clean checkout.
# Keep signing keys, passwords, and other secrets in ~/.gradle/gradle.properties.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Dependencies use AndroidX; Jetifier rewrites any that still reference the
# legacy support library.
android.useAndroidX=true
android.enableJetifier=true
