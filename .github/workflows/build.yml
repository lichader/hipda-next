name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Runs before setup-java so sdkmanager uses the runner's default JDK.
      # AGP 7.2.2 builds against platform 30 with build-tools 30.0.3.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-30" \
            "build-tools;30.0.3" > /dev/null

      # Gradle 7.3.3 and AGP 7.2.2 match the JDK 11 setup in AGENTS.md.
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build debug APK
        run: ./gradlew :hipda:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hipda-ng-debug-${{ github.run_number }}
          path: hipda/build/outputs/apk/debug/*.apk
          if-no-files-found: error
