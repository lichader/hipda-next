name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Gradle runs on JDK 21 (pinned in gradle/gradle-daemon-jvm.properties). Gradle installs the compile SDK platform and
      # build tools it needs on first use; the runner has accepted the licenses.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug and release APKs
        run: ./gradlew :hipda:assembleDebug :hipda:assembleRelease --stacktrace

      # Robolectric downloads its Android runtime jars (hundreds of MB) into ~/.m2 on first use.
      # Maven Central rate-limits repeated downloads of them, so keep them between runs.
      - name: Cache Robolectric runtime jars
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('hipda/build.gradle') }}
          restore-keys: robolectric-

      - name: Unit tests
        id: unit-tests
        run: ./gradlew :forum:check :hipda:testDebugUnitTest --stacktrace

      # Show results in the job summary and annotate failures. annotate_only needs no
      # checks: write permission, so it also works for pull requests from forks.
      - name: Publish test results
        if: ${{ !cancelled() && steps.unit-tests.outcome != 'skipped' }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          # :forum/build/test-results/test and :hipda/build/test-results/testDebugUnitTest
          report_paths: '*/build/test-results/*/TEST-*.xml'
          annotate_only: true
          detailed_summary: true
          failed_summary_logs: true
          require_tests: true

      - name: Lint
        run: ./gradlew --continue :hipda:lintDebug :emoji:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hipda-next-debug-${{ github.run_number }}
          path: hipda/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            forum/build/reports/tests/test
            hipda/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            hipda/build/reports/lint-results-debug.*
            emoji/build/reports/lint-results-debug.*
          if-no-files-found: ignore
