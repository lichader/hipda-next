name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # AGP 9.1 runs on JDK 17. Gradle installs the compile SDK platform and
      # build tools it needs on first use; the runner has accepted the licenses.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug and release APKs
        run: ./gradlew :hipda:assembleDebug :hipda:assembleRelease --stacktrace

      - name: Lint
        run: ./gradlew :hipda:lintDebug :emoji:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: hipda-ng-debug-${{ github.run_number }}
          path: hipda/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            hipda/build/reports/lint-results-debug.*
            emoji/build/reports/lint-results-debug.*
          if-no-files-found: ignore
