// Site adapter: the only code that knows the forum's URLs, HTML, form tokens and encodings.
// A pure Kotlin/JVM module, so it cannot use the Android SDK or app classes.
// See docs/architecture-layering-plan.md.
apply plugin: 'org.jetbrains.kotlin.jvm'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    // Callers pass in the app's OkHttpClient and call suspend functions.
    api platform("com.squareup.okhttp3:okhttp-bom:4.12.0")
    api "com.squareup.okhttp3:okhttp"
    api "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"

    implementation 'org.jsoup:jsoup:1.11.3'
    implementation 'com.google.code.gson:gson:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.squareup.okhttp3:mockwebserver"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version"
}
